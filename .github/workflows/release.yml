name: Release

# 触发：push tag v*（发版）/ workflow_dispatch（手动，只出 artifact 不建 release）
#
# 两段式：
#   build：安装、构建、跑测试、出包，把 zip 传成 artifact。
#   publish：把 zip 挂到一个 pre-release 上，发完回头核对不是 draft 且资产在位。
#
# 为什么不做平台矩阵：交付物是纯 JS，一个包跑遍所有平台，矩阵只是白花时间。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:server
      - run: pnpm run build
      - run: node scripts/dev/try-tool.mjs
      - run: pnpm run pack

      # tag 是 v0.1.0 而 manifest 写着别的版本，发出去的包装着错版本号。
      # 这一步在出包之后拦，因为 manifest 的版本是 build 时从源读的。
      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version")
          echo "tag = $TAG / manifest = $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag $TAG 与 manifest 版本 $MANIFEST 不一致"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hana-run-code-zip
          path: dist-extensions/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hana-run-code-zip
          path: dist-extensions

      # 一步出 pre-release：建的同时带上 zip 并标 prerelease。
      # 不先建 draft 再传：draft 的 URL 是 untagged-<hash>，要等正式发布才挂到 tag 上；
      # 而直接建成 prerelease 从第一秒起就是可下载的 releases/download/<tag>/<file>。
      #
      # 标 prerelease 而不是普通 release：latest 留给人工点，不让流水线把某个
      # 刚出来的版本自动推成大家默认拿到的那个。
      - name: 建 pre-release 并传包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          FILES=(dist-extensions/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::没有找到 zip，无法发布"
            exit 1
          fi
          printf '待上传：%s\n' "${FILES[@]}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为追加上传"
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "$TAG" \
              --generate-notes
          fi

      # 发完回头核：release 必须已经不是 draft，且资产真的在。
      - name: 核对发布结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          INFO=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)
          echo "$INFO"
          echo "$INFO" | node -e '
            let s = "";
            process.stdin.on("data", (c) => (s += c)).on("end", () => {
              const r = JSON.parse(s);
              if (r.isDraft) { console.error("::error::release 仍是 draft"); process.exit(1); }
              if (!r.assets || r.assets.length === 0) { console.error("::error::release 没有资产"); process.exit(1); }
              console.log("发布确认：prerelease=" + r.isPrerelease + "，资产 " + r.assets.length + " 个");
            });
          '
